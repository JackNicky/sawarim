<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بحث متقدم - مكتبة صوارم حيدرية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
        mark {
            background-color: #f59e0b;
            color: #111827;
            padding: 2px 4px;
            border-radius: 3px;
        }
        .loader {
            border: 5px solid #374151;
            border-top: 5px solid #f59e0b;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        [x-cloak] { display: none !important; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-200" x-data="searchApp()">

    <header class="bg-gray-800 shadow-lg p-4 sticky top-0 z-40">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-bold text-white">بحث فوري وذكي في المكتبة</h1>
            <a href="./index.html" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-2 px-4 rounded-lg transition duration-300 text-sm md:text-base">
                العودة للمكتبة
            </a>
        </div>
    </header>

    <main class="container mx-auto p-4 md:p-6">
        <!-- Initial Loading View -->
        <div x-show="indexing" x-transition class="text-center py-10">
             <div class="loader mx-auto"></div>
             <p x-text="indexingStatus" class="mt-4 text-amber-400 font-semibold"></p>
             <div class="w-full max-w-md mx-auto bg-gray-700 rounded-full h-2.5 mt-4">
                <div class="bg-amber-500 h-2.5 rounded-full transition-all duration-300" :style="`width: ${indexingProgress}%`"></div>
            </div>
        </div>

        <!-- Search View -->
        <div x-show="!indexing" x-cloak x-transition.opacity>
            <div class="bg-gray-800 rounded-xl p-4 md:p-6 shadow-2xl">
                <div class="flex flex-col md:flex-row gap-4 mb-4 items-start">
                    <!-- Search Input -->
                    <div class="relative flex-grow w-full">
                        <label for="search-input" class="block mb-2 text-sm font-medium text-gray-400">نص البحث (يدعم البحث الذكي والتقريبي):</label>
                        <div class="relative">
                            <textarea id="search-input"
                                x-model.debounce.300ms="searchQuery"
                                @keydown.enter.prevent="performSearch()"
                                placeholder="ابحث في محتوى جميع الكتب..." 
                                class="w-full bg-gray-700 border-2 border-gray-600 rounded-lg py-3 px-4 pr-10 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition" 
                                rows="1"></textarea>
                            <div class="absolute top-1/2 right-3 -translate-y-1/2">
                                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            </div>
                        </div>
                    </div>
                    <!-- Book Selector -->
                    <div class="w-full md:w-1/3">
                        <label for="book-select" class="block mb-2 text-sm font-medium text-gray-400">البحث في:</label>
                        <select id="book-select" x-model="selectedBookId" @change="performSearch()" class="w-full bg-gray-700 border-2 border-gray-600 rounded-lg py-3 px-4 text-white focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition">
                            <option value="all">جميع الكتب</option>
                            <!-- Options populated by JS -->
                        </select>
                    </div>
                </div>
            </div>
            
            <div id="search-results-view" class="mt-6">
                <div x-show="searching" class="text-center py-10">
                    <div class="loader mx-auto"></div>
                    <p class="mt-4 text-amber-400">...جاري البحث</p>
                </div>

                <div x-show="!searching && results.length > 0" x-cloak>
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold text-white">
                            النتائج: <span x-text="results.length" class="text-amber-400"></span>
                        </h2>
                    </div>
                    <div class="space-y-4">
                        <template x-for="res in results" :key="res.id">
                            <a :href="`index.html#/book/${res.doc.bookId}/volume/${res.doc.absoluteVolumeNumber}/page/${res.doc.pageNumber}?highlight=${encodeURIComponent(searchQuery)}`" target="_blank" class="block bg-gray-800 p-4 rounded-lg hover:bg-gray-700/70 transition-colors duration-300 shadow-md">
                                <h3 class="font-bold text-amber-400" x-text="res.doc.bookTitle"></h3>
                                <p class="text-sm text-gray-400 mb-2">
                                    <span x-text="res.doc.volumeTitle"></span> - 
                                    <span>صفحة <span x-text="res.doc.pageNumber"></span></span>
                                </p>
                                <p class="text-gray-300 text-sm leading-relaxed" x-html="createSnippet(res.doc.text, searchQuery)"></p>
                            </a>
                        </template>
                    </div>
                </div>
                
                <div x-show="!searching && searchQuery && results.length === 0" x-cloak class="text-center text-gray-400 py-10">
                    <p>لم يتم العثور على نتائج للبحث عن "<span x-text="searchQuery" class="font-bold text-white"></span>".</p>
                </div>
                
                 <div x-show="!searchQuery && !searching" x-cloak class="text-center text-gray-500 py-20">
                    <svg class="w-16 h-16 mx-auto mb-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <p class="text-lg">ابدأ البحث للعثور على ما تريد في المكتبة.</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        function searchApp() {
            return {
                indexing: true,
                indexingStatus: 'جاري تهيئة محرك البحث...',
                indexingProgress: 0,
                searching: false,
                searchQuery: '',
                selectedBookId: 'all',
                searchWorker: null,
                searchableContent: [],
                results: [],

                init() {
                    console.log('Initializing search application...');
                    this.searchWorker = new Worker('search-worker.js');
                    
                    this.searchWorker.onmessage = (event) => {
                        const { type, payload } = event.data;
                        if (type === 'progress') {
                            this.indexingStatus = `جاري فهرسة الكتب... (${payload.processed} / ${payload.total})`;
                            this.indexingProgress = (payload.processed / payload.total) * 100;
                        } else if (type === 'index-complete') {
                            this.indexing = false;
                            this.searchableContent = payload.searchableContent;
                            console.log('Indexing complete. Search is ready.');
                        } else if (type === 'search-results') {
                            this.results = payload.results.map(result => ({
                                id: result,
                                doc: this.searchableContent[result]
                            }));
                            this.searching = false;
                        } else if (type === 'error') {
                            this.indexingStatus = `حدث خطأ: ${payload.message}`;
                            console.error(payload.message);
                        }
                    };

                    this.populateBooksDropdown();
                    this.searchWorker.postMessage({ type: 'build-index' });

                    // Auto-resize textarea
                    const textarea = document.getElementById('search-input');
                    textarea.addEventListener('input', () => {
                        textarea.style.height = 'auto';
                        textarea.style.height = (textarea.scrollHeight) + 'px';
                    });
                    
                    this.$watch('searchQuery', (newQuery) => {
                        if(newQuery.trim().length > 1 || newQuery.trim().length === 0) {
                            this.performSearch();
                        }
                    });
                },

                async populateBooksDropdown() {
                    try {
                        const response = await fetch('./data/books.json');
                        const allBooks = await response.json();
                        const bookSelect = document.getElementById('book-select');
                        allBooks.forEach(book => {
                            const option = document.createElement('option');
                            option.value = book.id;
                            option.textContent = book.title;
                            bookSelect.appendChild(option);
                        });
                    } catch (error) {
                        console.error('Failed to populate books dropdown:', error);
                    }
                },

                performSearch() {
                    if (!this.searchWorker || this.indexing) return;
                    const query = this.searchQuery.trim();
                    if(query.length < 2) {
                        this.results = [];
                        return;
                    }
                    this.searching = true;
                    this.searchWorker.postMessage({
                        type: 'search',
                        payload: {
                            query: query,
                            bookId: this.selectedBookId
                        }
                    });
                },

                createSnippet(text, query, contextLength = 80) {
                    if (!text || !query) return (text || '').substring(0, contextLength * 2) + '...';

                    const createFlexibleRegex = (q) => {
                        let flexibleQuery = q.trim()
                            .replace(/أ|إ|آ/g, '[أإآا]')
                            .replace(/ى|ي/g, '[ىيئ]')
                            .replace(/ؤ|و/g, '[ؤو]')
                            .replace(/ة|ه/g, '[ةه]');
                        flexibleQuery = flexibleQuery.split('').join('[\\u064B-\\u0652]*');
                        flexibleQuery = flexibleQuery.replace(/\s+/g, '.{1,10}'); // Allow spaces and some chars in between
                        return new RegExp(flexibleQuery, 'i');
                    };

                    const regex = createFlexibleRegex(query);
                    const matchResult = regex.exec(text);
                    if (!matchResult) return text.substring(0, contextLength * 2) + (text.length > contextLength * 2 ? '...' : '');

                    const index = matchResult.index;
                    const matchText = matchResult[0];
                    const start = Math.max(0, index - contextLength);
                    const end = Math.min(text.length, index + matchText.length + contextLength);
                    let snippet = text.substring(start, end);

                    if (start > 0) snippet = "..." + snippet;
                    if (end < text.length) snippet = snippet + "...";
                    
                    const highlightRegex = new RegExp(query.trim().split(/\s+/).join('|'), 'gi');
                    return snippet.replace(highlightRegex, `<mark>$&</mark>`);
                }
            }
        }
    </script>
</body>
</html>
