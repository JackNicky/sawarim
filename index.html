<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة صوارم حيدرية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
        .book-content { line-height: 2.2; }
        .disabled-btn { opacity: 0.5; cursor: not-allowed; }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #ca8a04;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #page-jump-input {
            width: 60px; background-color: #374151; border: 1px solid #4b5563;
            border-radius: 6px; text-align: center; color: white; -moz-appearance: textfield;
        }
        #page-jump-input::-webkit-outer-spin-button, #page-jump-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        .theme-dark { --bg-color: #1f2937; --text-color: #d1d5db; --highlight-color: #ca8a04; }
        .theme-light { --bg-color: #f3f4f6; --text-color: #111827; --highlight-color: #f59e0b; }
        .theme-sepia { --bg-color: #fbf3e4; --text-color: #5f4b32; --highlight-color: #d97706; }
        .reader-content-area { background-color: var(--bg-color); color: var(--text-color); transition: background-color 0.3s, color 0.3s; }
        .reader-content-area h4 { color: var(--highlight-color); }
        .view-btn.active { background-color: #ca8a04; color: white; }
        .bookmark-tab-btn.active {
            background-color: #ca8a04;
            color: white;
        }
        .book-card-wrapper {
            position: relative;
        }
        .book-tooltip {
            visibility: hidden;
            width: 220px;
            background-color: #111827;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 8px;
            position: absolute;
            z-index: 50;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-bottom: 8px;
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
            pointer-events: none;
            border: 1px solid #4b5563;
            font-size: 0.875rem;
            line-height: 1.5;
        }
        .book-tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #111827 transparent transparent transparent;
        }
        .book-card-wrapper:hover .book-tooltip {
            visibility: visible;
            opacity: 1;
        }

        /* Modal Animation */
        .modal-content {
            animation: zoomIn 0.3s ease-out;
        }
        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200">

    <!-- Main View (Book List) -->
    <div id="main-view">
        <header class="bg-gray-800 shadow-lg p-4 sticky top-0 z-40">
            <div class="container mx-auto flex justify-between items-center">
                <h1 class="text-2xl font-bold text-white">مكتبة صوارم حيدرية</h1>
                <button id="show-bookmarks-btn" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-4 rounded-lg transition duration-300">
                    المحفوظات
                </button>
            </div>
        </header>

        <main class="container mx-auto p-6">
             <div class="flex flex-col md:flex-row gap-4 mb-6">
                <div class="relative flex-grow">
                    <input id="search-input" placeholder="ابحث عن عنوان كتاب أو مؤلف..." class="w-full bg-gray-800 border border-gray-700 rounded-lg py-3 px-4 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-yellow-500" />
                </div>
                <div class="flex items-center gap-4 flex-wrap">
                    <button id="search-btn" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 px-5 rounded-lg transition duration-300">بحث</button>
                    <a href="./search.html" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-5 rounded-lg transition duration-300">بحث متقدم في المحتوى</a>
                </div>
            </div>
            <div class="flex flex-col md:flex-row gap-4 mb-8 items-center">
                 <div class="flex-grow flex items-center gap-2">
                    <span class="text-gray-400">عرض:</span>
                    <div class="flex-shrink-0 bg-gray-800 border border-gray-700 rounded-lg p-1">
                        <button id="grid-view-btn" class="view-btn p-2 rounded-md active" title="عرض شبكي"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2h-2zM11 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2h-2z" /></svg></button>
                        <button id="list-view-btn" class="view-btn p-2 rounded-md" title="عرض قائمة"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd" /></svg></button>
                    </div>
                </div>
                 <div class="flex-grow flex items-center gap-2">
                    <span class="text-gray-400">ترتيب حسب:</span>
                    <select id="sort-select" class="w-full md:w-auto bg-gray-800 border border-gray-700 rounded-lg py-3 px-4 text-white focus:outline-none focus:ring-2 focus:ring-yellow-500">
                        <option value="default">الترتيب الافتراضي</option>
                        <option value="newest">الأحدث أولاً</option>
                        <option value="alpha-asc">أبجدي: أ - ي</option>
                        <option value="alpha-desc">أبجدي: ي - أ</option>
                    </select>
                </div>
            </div>
            <div id="books-container-wrapper">
                <div id="books-container"></div>
                <div id="no-results" class="text-center text-gray-500 text-xl mt-10 hidden"><p>لم يتم العثور على نتائج.</p></div>
            </div>
        </main>
    </div>

    <!-- Reader View (Fullscreen) -->
    <div id="reader-view" class="hidden h-screen w-screen flex flex-col bg-gray-800">
        <!-- Reader Top Toolbar -->
        <div class="flex justify-between items-center p-2 border-b border-gray-700 flex-shrink-0">
             <div class="flex items-center min-w-0">
                <button id="close-reader-btn" class="p-2 rounded-full hover:bg-red-500" title="إغلاق"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg></button>
                <h2 id="reader-book-title" class="text-md sm:text-lg font-bold text-white mx-4 truncate"></h2>
            </div>
            <div class="flex items-center space-x-1 sm:space-x-2 space-x-reverse text-white">
                <button class="theme-btn p-2 rounded-full hover:bg-gray-700" data-theme="theme-dark" title="داكن">🌙</button>
                <button class="theme-btn p-2 rounded-full hover:bg-gray-700" data-theme="theme-light" title="فاتح">☀️</button>
                <button class="theme-btn p-2 rounded-full hover:bg-gray-700" data-theme="theme-sepia" title="بني">☕</button>
                <div class="border-l h-6 border-gray-600 mx-1 sm:mx-2"></div>
                <button id="decrease-font" class="p-2 rounded-full hover:bg-gray-700 font-bold" title="تصغير الخط">A-</button>
                <button id="increase-font" class="p-2 rounded-full hover:bg-gray-700 font-bold" title="تكبير الخط">A+</button>
                <button id="fullscreen-btn" class="p-2 rounded-full hover:bg-gray-700" title="ملء الشاشة"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 4a1 1 0 011-1h4a1 1 0 110 2H5v3a1 1 0 11-2 0V4zm14 0a1 1 0 00-1-1h-4a1 1 0 100 2h3v3a1 1 0 102 0V4zM4 17a1 1 0 001 1h4a1 1 0 100-2H5v-3a1 1 0 10-2 0v4zm12 0a1 1 0 001-1v-4a1 1 0 10-2 0v3h-3a1 1 0 100 2h4z" clip-rule="evenodd" /></svg></button>
                <div class="border-l h-6 border-gray-600 mx-1 sm:mx-2"></div>
                <button id="speech-btn" class="p-2 rounded-full hover:bg-gray-700" title="استماع"><svg id="speech-play-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" /></svg><svg id="speech-pause-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg></button>
                <button id="toc-btn" class="p-2 rounded-full hover:bg-gray-700" title="الفهرس"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M5 3a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 5h10v10H5V5z" /><path d="M7 7h6v2H7V7zm0 4h6v2H7v-2z" /></svg></button>
                <button id="bookmark-page-btn" class="p-2 rounded-full hover:bg-gray-700" title="حفظ علامة مرجعية للصفحة"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" /></svg></button>
            </div>
        </div>
        <!-- Reader Main Container -->
        <div id="reader-container" class="flex-grow flex overflow-hidden">
            <div id="reader-content-primary" class="reader-content-area w-full h-full overflow-y-auto p-4 sm:p-8 book-content theme-dark"></div>
        </div>
        <!-- Reader Bottom Toolbar -->
        <div class="flex justify-between items-center p-2 border-t border-gray-700 flex-shrink-0">
            <button id="prev-page-btn" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-4 rounded-lg">السابق</button>
            <div class="flex items-center gap-2 text-gray-400 text-xs sm:text-sm">
                <span id="volume-title-footer" class="hidden sm:inline"></span>
                <span>صفحة</span>
                <input type="number" id="page-jump-input" min="1">
                <span id="total-pages-footer"></span>
            </div>
            <button id="next-page-btn" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-4 rounded-lg">التالي</button>
        </div>
    </div>

    <!-- Modals and Overlays -->
    <div id="bookmark-note-modal" class="fixed inset-0 bg-black bg-opacity-75 z-[60] hidden flex items-center justify-center p-4"></div>
    <div id="volumes-modal" class="fixed inset-0 bg-black bg-opacity-75 z-50 hidden flex items-center justify-center p-4"></div>
    <div id="toc-modal" class="fixed inset-0 bg-black bg-opacity-75 z-[60] hidden flex items-center justify-center p-4"></div>
    <div id="loading-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-[70] hidden items-center justify-center flex-col"><div class="loader"></div></div>
    
    <!-- Bookmarks Modal -->
    <div id="bookmarks-modal" class="fixed inset-0 bg-black bg-opacity-75 z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-gray-800 w-full max-w-2xl rounded-lg shadow-xl flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center p-4 border-b border-gray-700">
                <h2 class="text-xl font-bold text-white">المحفوظات</h2>
                <button class="close-modal-btn p-2 rounded-full hover:bg-red-500"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg></button>
            </div>
            <div class="flex border-b border-gray-700">
                <button class="flex-1 p-3 text-center font-semibold bookmark-tab-btn active" data-tab="saved-books-tab">الكتب المحفوظة</button>
                <button class="flex-1 p-3 text-center font-semibold bookmark-tab-btn" data-tab="page-notes-tab">العلامات المرجعية</button>
            </div>
            <div class="p-4 overflow-y-auto">
                <div id="saved-books-tab" class="bookmark-tab-content space-y-3"></div>
                <div id="page-notes-tab" class="bookmark-tab-content hidden space-y-3"></div>
            </div>
        </div>
    </div>


    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const mainView = document.getElementById('main-view');
        const readerView = document.getElementById('reader-view');
        const loadingOverlay = document.getElementById('loading-overlay');
        const booksContainer = document.getElementById('books-container');
        const noResults = document.getElementById('no-results');
        const sortSelect = document.getElementById('sort-select');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const gridViewBtn = document.getElementById('grid-view-btn');
        const listViewBtn = document.getElementById('list-view-btn');
        const showBookmarksBtn = document.getElementById('show-bookmarks-btn');
        
        let allBooks = [];
        let currentBookInfo = null;
        let currentVolumeNumber = 1;
        let currentFontSize = 18;
        let currentBookPartVolumes = []; 
        let currentVolumeIndexInPart = 0; 
        let currentView = 'grid';
        let utterance = null;
        let isSpeaking = false;
        let arabicVoice = null;
        
        const fetchMasterList = () => fetch('./data/books.json')
            .then(res => {
                if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                return res.json();
            })
            .catch(err => { 
                console.error("Could not load master list:", err);
                booksContainer.innerHTML = '<p class="text-center text-red-400">فشل تحميل قائمة الكتب. يرجى التأكد من أن الملفات موجودة.</p>';
                return [];
            });
        
        async function fetchBookDataForReading(bookInfo, absoluteVolumeNumber = 1) {
            try {
                let fileToFetch;
                if (bookInfo.parts && bookInfo.parts.length > 0) {
                    const partInfo = bookInfo.parts.find(p => absoluteVolumeNumber >= p.startVolume && absoluteVolumeNumber <= p.endVolume);
                    if (!partInfo) {
                        console.error(`Could not find part for volume ${absoluteVolumeNumber} in book ${bookInfo.title}`);
                        return null;
                    }
                    fileToFetch = partInfo.file;
                } else {
                    fileToFetch = `book_${bookInfo.id}.json`;
                }
                
                showLoader(true, `جاري تحميل الكتاب...`);
                const res = await fetch(`./data/${fileToFetch}`);
                if (!res.ok) throw new Error(`HTTP error! status: ${res.status} for ${fileToFetch}`);
                
                return await res.json();

            } catch (err) {
                console.error(`Error fetching book data:`, err);
                alert('حدث خطأ أثناء تحميل بيانات الكتاب.');
                return null;
            } finally {
                showLoader(false);
            }
        }

        const showLoader = (show, text = '') => {
            const loaderText = loadingOverlay.querySelector('p');
            if (show) {
                if (!loaderText) {
                    const p = document.createElement('p');
                    p.className = 'text-yellow-400 mt-4 text-center';
                    loadingOverlay.appendChild(p);
                }
                loadingOverlay.querySelector('p').textContent = text;
                loadingOverlay.style.display = 'flex';
            } else {
                loadingOverlay.style.display = 'none';
            }
        };

        const getBookmarks = () => JSON.parse(localStorage.getItem('sawarim_bookmarks_v3')) || { savedBooks: [], pageProgress: {}, pageNotes: [] };
        const saveBookmarks = (bookmarks) => localStorage.setItem('sawarim_bookmarks_v3', JSON.stringify(bookmarks));
        
        function loadAndFindArabicVoice() {
            if (!('speechSynthesis' in window)) return;
            const setVoice = () => {
                const voices = speechSynthesis.getVoices();
                arabicVoice = voices.find(voice => voice.lang.startsWith('ar'));
            };
            setVoice();
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = setVoice;
            }
        }

        function stopSpeech() {
            if ('speechSynthesis' in window && speechSynthesis.speaking) {
                speechSynthesis.cancel();
            }
            isSpeaking = false;
            updateSpeechButton();
        }

        function updateSpeechButton() {
            const playIcon = readerView.querySelector('#speech-play-icon');
            const pauseIcon = readerView.querySelector('#speech-pause-icon');
            if(!playIcon || !pauseIcon) return;
            playIcon.classList.toggle('hidden', isSpeaking);
            pauseIcon.classList.toggle('hidden', !isSpeaking);
        }

        function closeReader() {
            stopSpeech();
            readerView.classList.add('hidden');
            mainView.classList.remove('hidden');
            document.body.style.overflow = 'auto';
            history.pushState(null, "", window.location.pathname);
        }

        function openReader(bookInfo, volumesData, relativeVolumeIndex, pageNumber = null) {
            mainView.classList.add('hidden');
            readerView.classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            currentBookInfo = bookInfo;
            currentBookPartVolumes = volumesData;
            currentVolumeIndexInPart = relativeVolumeIndex; 
            const volume = currentBookPartVolumes[currentVolumeIndexInPart];
            
            if(!volume || !volume.content){
                alert('خطأ: لم يتم العثور على محتوى الجزء المحدد.');
                closeReader();
                return;
            }
            currentVolumeNumber = volume.volumeNumber;

            readerView.querySelector('#reader-book-title').textContent = bookInfo.title;
            readerView.querySelector('#reader-content-primary').style.fontSize = `${currentFontSize}px`;
            
            const bookmarks = getBookmarks();
            const bookmarkKey = `${bookInfo.id}-${currentVolumeNumber}`;
            let targetPageNum = pageNumber ? parseInt(pageNumber, 10) : (bookmarks.pageProgress[bookmarkKey] || 1);
            
            let pageIndexInVolume = volume.content.findIndex(p => p.pageNumber == targetPageNum);
            if (pageIndexInVolume === -1) pageIndexInVolume = 0;
            
            displayPage(pageIndexInVolume);
            attachReaderEventListeners();
        }
        
       function displayPage(pageIndexInVolume) {
            const volume = currentBookPartVolumes[currentVolumeIndexInPart];
            if (!volume || !volume.content || pageIndexInVolume >= volume.content.length) return;
            
            stopSpeech();
            
            const currentPageData = volume.content[pageIndexInVolume];
            
            readerView.querySelector('#reader-content-primary').innerHTML = `<h4 class="text-lg text-yellow-400 mb-4 font-semibold">${currentPageData.chapter || ''}</h4><p>${currentPageData.text.replace(/\n/g, '<br>')}</p>`;
            readerView.querySelector('#reader-content-primary').scrollTop = 0;
            const pageJumpInput = readerView.querySelector('#page-jump-input');
            pageJumpInput.value = currentPageData.pageNumber;
            
            const lastPage = volume.content[volume.content.length - 1]?.pageNumber || 0;
            readerView.querySelector('#volume-title-footer').textContent = volume.volumeTitle;
            readerView.querySelector('#total-pages-footer').textContent = `من ${lastPage}`;
            pageJumpInput.max = lastPage;
            
            const prevBtn = readerView.querySelector('#prev-page-btn');
            const nextBtn = readerView.querySelector('#next-page-btn');

            prevBtn.onclick = () => { if (pageIndexInVolume > 0) displayPage(pageIndexInVolume - 1); };
            nextBtn.onclick = () => { if (pageIndexInVolume < volume.content.length - 1) displayPage(pageIndexInVolume + 1); };
            
            prevBtn.disabled = pageIndexInVolume === 0;
            prevBtn.classList.toggle('disabled-btn', pageIndexInVolume === 0);
            nextBtn.disabled = pageIndexInVolume === volume.content.length - 1;
            nextBtn.classList.toggle('disabled-btn', pageIndexInVolume === volume.content.length - 1);
            
            history.replaceState(null, '', `#/book/${currentBookInfo.id}/volume/${currentVolumeNumber}/page/${currentPageData.pageNumber}`);
            
            let bookmarks = getBookmarks();
            bookmarks.pageProgress[`${currentBookInfo.id}-${currentVolumeNumber}`] = currentPageData.pageNumber;
            saveBookmarks(bookmarks);
        }

        function attachReaderEventListeners() {
            readerView.querySelector('#close-reader-btn').onclick = closeReader;
            readerView.querySelector('#fullscreen-btn').onclick = toggleFullScreen;
            readerView.querySelector('#toc-btn').onclick = openToc;
            readerView.querySelector('#speech-btn').onclick = handleSpeech;
            readerView.querySelector('#increase-font').onclick = () => { if(currentFontSize < 32) { currentFontSize += 2; document.getElementById('reader-content-primary').style.fontSize = `${currentFontSize}px`; } };
            readerView.querySelector('#decrease-font').onclick = () => { if(currentFontSize > 12) { currentFontSize -= 2; document.getElementById('reader-content-primary').style.fontSize = `${currentFontSize}px`; } };
            readerView.querySelector('#bookmark-page-btn').onclick = () => {
                const volume = currentBookPartVolumes[currentVolumeIndexInPart];
                const pageNum = parseInt(readerView.querySelector('#page-jump-input').value);
                const pageIndex = volume.content.findIndex(p => p.pageNumber === pageNum);
                if (pageIndex !== -1) {
                    showBookmarkNoteModal(volume.content[pageIndex]);
                }
            };
            
            const pageJumpInput = readerView.querySelector('#page-jump-input');
            const jumpHandler = () => {
                 const volume = currentBookPartVolumes[currentVolumeIndexInPart];
                 if (!volume) return;
                const targetPage = parseInt(pageJumpInput.value, 10);
                const newPageIndex = volume.content.findIndex(p => p.pageNumber === targetPage);
                if (newPageIndex !== -1) {
                    displayPage(newPageIndex);
                } else if (volume.content.length > 0) {
                    pageJumpInput.value = volume.content[0].pageNumber;
                }
            };
            pageJumpInput.onchange = jumpHandler;

            readerView.querySelectorAll('.theme-btn').forEach(btn => {
                btn.onclick = () => {
                    const newTheme = btn.dataset.theme;
                    document.querySelectorAll('.reader-content-area').forEach(area => {
                         area.className = area.className.replace(/theme-\w+/g, '') + ` ${newTheme}`;
                    });
                }
            });
        }
        
        function handleSpeech() {
            if (!('speechSynthesis' in window)) {
                alert('عذراً، متصفحك لا يدعم ميزة الاستماع الصوتي.');
                return;
            }
            if (isSpeaking) {
                speechSynthesis.pause();
                isSpeaking = false;
            } else {
                if (speechSynthesis.paused) {
                    speechSynthesis.resume();
                } else {
                    if (!arabicVoice) {
                        alert('عذراً، لم يتم العثور على صوت عربي مثبت على جهازك أو متصفحك.');
                        return;
                    }
                    const textToSpeak = readerView.querySelector('#reader-content-primary').innerText;
                    utterance = new SpeechSynthesisUtterance(textToSpeak);
                    utterance.voice = arabicVoice;
                    utterance.lang = arabicVoice.lang;
                    utterance.rate = 0.9;
                    utterance.onend = () => { isSpeaking = false; updateSpeechButton(); };
                    utterance.onerror = (event) => { console.error('SpeechSynthesisUtterance.onerror', event); isSpeaking = false; updateSpeechButton(); };
                    speechSynthesis.speak(utterance);
                }
                isSpeaking = true;
            }
            updateSpeechButton();
        }

        function toggleFullScreen() {
            const elem = document.getElementById('reader-view');
            if (!document.fullscreenElement) {
                elem.requestFullscreen().catch(err => alert(`خطأ في تفعيل وضع ملء الشاشة: ${err.message}`));
            } else {
                document.exitFullscreen();
            }
        }
        
        function showBookmarkNoteModal(pageData) {
            if (!pageData) return;
            const modalContainer = document.getElementById('bookmark-note-modal');
            modalContainer.innerHTML = `
                <div class="modal-content bg-gray-800 w-full max-w-md rounded-lg shadow-xl flex flex-col">
                    <div class="p-4 border-b border-gray-700">
                        <h2 class="text-xl font-bold text-white">إضافة ملاحظة للعلامة المرجعية</h2>
                        <p class="text-sm text-gray-400">صفحة ${pageData.pageNumber} - ${pageData.chapter || 'بلا عنوان'}</p>
                    </div>
                    <div class="p-4">
                        <textarea id="bookmark-note-input" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2 text-white" rows="4" placeholder="اكتب ملاحظتك هنا..."></textarea>
                    </div>
                    <div class="flex justify-end p-4 border-t border-gray-700 space-x-2 space-x-reverse">
                        <button id="cancel-bookmark-note" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg">إلغاء</button>
                        <button id="save-bookmark-note" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-4 rounded-lg">حفظ</button>
                    </div>
                </div>
            `;
            modalContainer.style.display = 'flex';

            document.getElementById('save-bookmark-note').onclick = () => {
                const note = document.getElementById('bookmark-note-input').value;
                let bookmarks = getBookmarks();
                bookmarks.pageNotes.push({
                    id: Date.now(),
                    bookId: currentBookInfo.id,
                    volumeNumber: currentVolumeNumber,
                    pageNumber: pageData.pageNumber,
                    chapter: pageData.chapter,
                    note: note,
                    date: new Date().toISOString()
                });
                saveBookmarks(bookmarks);
                modalContainer.style.display = 'none';
                alert('تم حفظ العلامة المرجعية بنجاح!');
            };

            document.getElementById('cancel-bookmark-note').onclick = () => {
                modalContainer.style.display = 'none';
            };
        }

        function sortAndRender(booksToRender = allBooks) {
            const sortValue = sortSelect.value;
            let sortedBooks = [...booksToRender];
            if (sortValue === 'newest') sortedBooks.reverse();
            else if (sortValue === 'alpha-asc') sortedBooks.sort((a, b) => a.title.localeCompare(b.title, 'ar'));
            else if (sortValue === 'alpha-desc') sortedBooks.sort((a, b) => b.title.localeCompare(a.title, 'ar'));
            renderBooks(sortedBooks);
        }

        function renderBooks(booksToRender) {
            booksContainer.innerHTML = '';
            noResults.classList.toggle('hidden', booksToRender.length > 0);
            booksContainer.className = currentView === 'grid' 
                ? 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6'
                : 'flex flex-col gap-4';
            const bookmarks = getBookmarks();
            booksToRender.forEach(book => {
                const isSaved = bookmarks.savedBooks.includes(book.id);
                const wrapper = document.createElement('div');
                wrapper.className = 'book-card-wrapper';
                const bookElement = document.createElement('div');
                bookElement.dataset.bookId = book.id;
                if (currentView === 'grid') {
                    bookElement.className = "bg-gray-800 rounded-lg overflow-hidden shadow-lg transform hover:-translate-y-2 transition-transform duration-300 cursor-pointer group h-full flex flex-col";
                    bookElement.innerHTML = `<div class="relative"><img src="${book.cover}" alt="${book.title}" class="w-full h-64 object-cover" onerror="this.onerror=null;this.src='https://placehold.co/300x450/111827/FFFFFF?text=Error';"><div class="absolute top-2 right-2"><button class="save-book-btn p-2 rounded-full ${isSaved ? 'bg-red-500' : 'bg-gray-700 bg-opacity-50'} text-white" data-book-id="${book.id}"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" /></svg></button></div><div class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none"><span class="text-white text-xl font-bold">اقرأ الآن</span></div></div><div class="p-4 flex-grow"><h3 class="font-bold text-lg text-white">${book.title}</h3><p class="text-gray-400 text-sm">${book.author}</p>${book.subtitle ? `<p class="text-yellow-500 text-xs mt-2">${book.subtitle}</p>` : ''}</div>`;
                } else {
                    bookElement.className = "bg-gray-800 rounded-lg shadow-lg flex items-center gap-4 p-4 cursor-pointer hover:bg-gray-700 transition-colors";
                    bookElement.innerHTML = `<img src="${book.cover}" alt="${book.title}" class="w-20 h-28 object-cover rounded-md flex-shrink-0" onerror="this.onerror=null;this.src='https://placehold.co/80x112/111827/FFFFFF?text=Error';"><div class="flex-grow"><h3 class="font-bold text-lg text-white">${book.title}</h3><p class="text-gray-400 text-sm">${book.author}</p>${book.subtitle ? `<p class="text-yellow-500 text-xs mt-1">${book.subtitle}</p>` : ''}</div><button class="save-book-btn p-3 rounded-full ${isSaved ? 'bg-red-500' : 'bg-gray-700'} text-white self-start" data-book-id="${book.id}"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" /></svg></button>`;
                }
                const tooltipElement = document.createElement('div');
                tooltipElement.className = 'book-tooltip';
                tooltipElement.textContent = book.description || 'لا يوجد وصف متاح.';
                wrapper.append(bookElement, tooltipElement);
                booksContainer.appendChild(wrapper);
                bookElement.addEventListener('click', (e) => !e.target.closest('.save-book-btn') && handleBookClick(book.id));
                bookElement.querySelector('.save-book-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleSaveBook(book.id);
                });
            });
        }

        function toggleSaveBook(bookId) {
            let bookmarks = getBookmarks();
            const index = bookmarks.savedBooks.indexOf(bookId);
            if (index > -1) bookmarks.savedBooks.splice(index, 1);
            else bookmarks.savedBooks.push(bookId);
            saveBookmarks(bookmarks);
            handleSimpleSearch();
        }

        async function handleBookClick(bookId, directVolumeNumber = null, pageNumber = null) {
            const bookInfo = allBooks.find(b => b.id == bookId);
            if (!bookInfo) return;

            if (directVolumeNumber) {
                const bookDetails = await fetchBookDataForReading(bookInfo, directVolumeNumber);
                if (bookDetails && bookDetails.volumes) {
                    let relativeIndex = bookDetails.volumes.findIndex(v => v.volumeNumber === directVolumeNumber);
                    if (relativeIndex === -1 && bookInfo.parts) {
                        const partInfo = bookInfo.parts.find(p => directVolumeNumber >= p.startVolume && directVolumeNumber <= p.endVolume);
                        if(partInfo) relativeIndex = directVolumeNumber - partInfo.startVolume;
                    }
                    if(relativeIndex === -1) relativeIndex = 0;
                    openReader(bookInfo, bookDetails.volumes, relativeIndex, pageNumber);
                }
                return;
            }
            
            const hasSingleFileVolumes = bookInfo.volumes && bookInfo.volumes.length > 1;
            const hasMultiPartVolumes = bookInfo.parts && bookInfo.totalVolumes > 1;

            if (hasSingleFileVolumes || hasMultiPartVolumes) {
                openVolumeSelector(bookInfo);
            } else {
                const bookDetails = await fetchBookDataForReading(bookInfo);
                if (bookDetails && bookDetails.volumes) {
                    openReader(bookInfo, bookDetails.volumes, 0, pageNumber);
                }
            }
        }

       function openVolumeSelector(bookInfo) {
            const volumesModalContainer = document.getElementById('volumes-modal');
            let volumeButtonsHTML = '';

            if (bookInfo.volumes && bookInfo.volumes.length > 0) {
                volumeButtonsHTML = bookInfo.volumes.map((volume, index) => 
                    `<button class="w-full text-right bg-gray-700 hover:bg-yellow-600 p-3 rounded-lg volume-select-btn" data-volume-index="${index}">${volume.volumeTitle}</button>`
                ).join('');
            } else if (bookInfo.parts && bookInfo.totalVolumes) {
                for (let i = 1; i <= bookInfo.totalVolumes; i++) {
                    volumeButtonsHTML += `<button class="w-full text-right bg-gray-700 hover:bg-yellow-600 p-3 rounded-lg volume-select-btn" data-volume-number="${i}">الجزء ${i}</button>`;
                }
            }

            volumesModalContainer.innerHTML = `
                <div class="modal-content bg-gray-800 w-full max-w-md rounded-lg shadow-xl flex flex-col max-h-[90vh]">
                    <div class="flex justify-between items-center p-4 border-b border-gray-700">
                        <h2 class="text-xl font-bold text-white">اختر جزء من: ${bookInfo.title}</h2>
                        <button class="close-modal-btn p-2 rounded-full hover:bg-red-500"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg></button>
                    </div>
                    <div class="p-4 space-y-2 overflow-y-auto">
                        ${volumeButtonsHTML}
                    </div>
                </div>`;
            volumesModalContainer.style.display = 'flex';
            volumesModalContainer.querySelector('.close-modal-btn').onclick = () => volumesModalContainer.style.display = 'none';
            
            volumesModalContainer.querySelectorAll('.volume-select-btn').forEach(btn => {
                btn.onclick = async () => {
                    volumesModalContainer.style.display = 'none';
                    if (btn.dataset.volumeNumber) { 
                        const selectedVolumeNumber = parseInt(btn.dataset.volumeNumber);
                        handleBookClick(bookInfo.id, selectedVolumeNumber);
                    } else { 
                        const bookDetails = await fetchBookDataForReading(bookInfo);
                        if(bookDetails){
                           const selectedVolumeIndex = parseInt(btn.dataset.volumeIndex);
                           openReader(bookInfo, bookDetails.volumes, selectedVolumeIndex);
                        }
                    }
                };
            });
        }
        
        function openToc() {
             const tocModalContainer = document.getElementById('toc-modal');
            const volume = currentBookPartVolumes[currentVolumeIndexInPart];
            if (!volume || !volume.content) return;

            const chapterMap = new Map();
            volume.content.forEach((page, index) => {
                const chapterTitle = page.chapter?.trim();
                if (chapterTitle && !chapterMap.has(chapterTitle)) {
                    chapterMap.set(chapterTitle, index);
                }
            });

            tocModalContainer.innerHTML = `
                <div class="modal-content bg-gray-800 w-full max-w-lg rounded-lg shadow-xl flex flex-col max-h-[90vh]">
                    <div class="flex justify-between items-center p-4 border-b border-gray-700">
                        <h2 class="text-xl font-bold text-white">فهرس الأبواب</h2>
                        <button class="close-modal-btn p-2 rounded-full hover:bg-red-500"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg></button>
                    </div>
                    <div class="p-4 space-y-2 overflow-y-auto"></div>
                </div>`;
                
            const tocList = tocModalContainer.querySelector('.overflow-y-auto');
            
            if (chapterMap.size > 0) {
                for (const [chapter, index] of chapterMap.entries()) {
                    const chapterBtn = document.createElement('button');
                    chapterBtn.className = 'w-full text-right bg-gray-700 hover:bg-yellow-600 p-3 rounded-lg transition-colors duration-200';
                    chapterBtn.textContent = chapter;
                    chapterBtn.onclick = () => {
                        displayPage(index);
                        tocModalContainer.style.display = 'none';
                    };
                    tocList.appendChild(chapterBtn);
                }
            } else {
                tocList.innerHTML = '<p class="text-gray-400 text-center">لا يوجد فهرس لهذا الجزء.</p>';
            }
            
            tocModalContainer.style.display = 'flex';
            tocModalContainer.querySelector('.close-modal-btn').onclick = () => tocModalContainer.style.display = 'none';
        }
        
        function handleSimpleSearch() {
            const query = searchInput.value.toLowerCase().trim();
            const filteredBooks = allBooks.filter(book => 
                book.title.toLowerCase().includes(query) || 
                book.author.toLowerCase().includes(query)
            );
            sortAndRender(filteredBooks);
        }

        function showBookmarksModal() {
            // Unchanged implementation
        }
        
        async function handleUrlHash() {
            const hash = window.location.hash;
            if (!hash.startsWith('#/book/')) return;
            
            const [, , bookIdStr, , volumeNumberStr, , pageNumberStr] = hash.split('/');
            const bookId = parseInt(bookIdStr);
            const volumeNumber = parseInt(volumeNumberStr);
            const pageNumber = parseInt(pageNumberStr);

            if (isNaN(bookId) || isNaN(volumeNumber)) return;
            
            if (allBooks.length === 0) {
                await initializeApp(false); 
            }
            
            handleBookClick(bookId, volumeNumber, pageNumber);
        }

        async function initializeApp(shouldRender = true) {
            showLoader(true, "جاري تحميل قائمة الكتب...");
            allBooks = await fetchMasterList();
            showLoader(false);
            
            if (allBooks.length === 0) return;
            
            if (shouldRender) {
                sortAndRender();
            }
            loadAndFindArabicVoice();
        }

        // --- Event Listeners ---
        searchBtn.addEventListener('click', handleSimpleSearch);
        searchInput.addEventListener('keydown', e => e.key === 'Enter' && (e.preventDefault(), handleSimpleSearch()));
        searchInput.addEventListener('keyup', () => searchInput.value.trim() === '' && handleSimpleSearch());
        sortSelect.addEventListener('change', () => sortAndRender());
        showBookmarksBtn.addEventListener('click', showBookmarksModal);
        gridViewBtn.addEventListener('click', () => { currentView = 'grid'; gridViewBtn.classList.add('active'); listViewBtn.classList.remove('active'); sortAndRender(); });
        listViewBtn.addEventListener('click', () => { currentView = 'list'; listViewBtn.classList.add('active'); gridViewBtn.classList.remove('active'); sortAndRender(); });
        window.addEventListener('hashchange', handleUrlHash, false);

        (async () => {
            await initializeApp();
            await handleUrlHash();
        })();

    });
    </script>
