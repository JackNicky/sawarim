<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة صوارم حيدرية - نسخة محسنة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
        .disabled-btn { opacity: 0.5; cursor: not-allowed; }
        .loader-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(17, 24, 39, 0.8);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999;
        }
        .loader {
            border: 5px solid #4b5563;
            border-top: 5px solid #ca8a04;
            border-radius: 50%; width: 50px; height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .view-btn.active { background-color: #ca8a04; color: #111827; }
    </style>
</head>
<body class="bg-gray-900 text-gray-200">

    <!-- Loader -->
    <div id="loader" class="loader-container hidden">
        <div class="text-center">
            <div class="loader mx-auto"></div>
            <p id="loader-text" class="mt-4 text-lg text-yellow-400">جاري التحميل...</p>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container mx-auto p-4 md:p-8">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-yellow-400">مكتبة صوارم حيدرية</h1>
            <p class="text-gray-400 mt-2">نسخة محسنة للتصفح السريع (تعمل بالكامل في المتصفح)</p>
        </header>

        <!-- Main Content (will be replaced by book view) -->
        <main id="main-content">
            <!-- Search and Filter Bar -->
            <div class="bg-gray-800 p-4 rounded-lg mb-8 flex flex-col md:flex-row gap-4 items-center">
                <input id="search-input" type="text" placeholder="ابحث عن كتاب..." class="flex-grow bg-gray-700 text-white p-2 rounded-md border border-gray-600 focus:outline-none focus:ring-2 focus:ring-yellow-500 w-full">
                <div class="flex items-center gap-4 w-full md:w-auto">
                    <select id="sort-select" class="bg-gray-700 text-white p-2 rounded-md border border-gray-600 focus:outline-none w-full md:w-auto">
                        <option value="default">ترتيب افتراضي</option>
                        <option value="title_asc">أبجدي (أ-ي)</option>
                        <option value="title_desc">أبجدي (ي-أ)</option>
                    </select>
                     <div class="flex items-center bg-gray-700 rounded-md border border-gray-600">
                        <button id="grid-view-btn" class="view-btn p-2 rounded-r-md active" title="عرض شبكي">G</button>
                        <button id="list-view-btn" class="view-btn p-2 rounded-l-md" title="عرض قائمة">L</button>
                    </div>
                    <a href="search.html" class="bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-2 px-4 rounded-md transition-colors w-full text-center md:w-auto">بحث متقدم</a>
                </div>
            </div>

            <!-- Books List -->
            <div id="books-list" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6">
                <!-- Book items will be injected here -->
            </div>
        </main>

        <!-- Book View (hidden by default) -->
        <div id="book-view" class="hidden">
            <!-- Book view content will be injected here -->
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const mainContent = document.getElementById('main-content');
        const bookView = document.getElementById('book-view');
        const booksListContainer = document.getElementById('books-list');
        const searchInput = document.getElementById('search-input');
        const sortSelect = document.getElementById('sort-select');
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loader-text');
        const gridViewBtn = document.getElementById('grid-view-btn');
        const listViewBtn = document.getElementById('list-view-btn');

        let allBooks = []; // سيحتوي على قائمة الكتب الرئيسية
        let bookContentCache = {}; // لتخزين محتوى الكتب التي تم تحميلها
        let filteredBooks = [];
        let currentView = 'grid';

        function showLoader(show, text = 'جاري التحميل...') {
            loaderText.textContent = text;
            loader.classList.toggle('hidden', !show);
        }

        // --- Data Fetching ---
        async function fetchMasterList() {
            try {
                const response = await fetch('data/books.json');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error("Could not fetch master book list:", error);
                booksListContainer.innerHTML = `<p class="text-red-400 text-center col-span-full">فشل تحميل قائمة الكتب. يرجى المحاولة مرة أخرى.</p>`;
                return [];
            }
        }

        async function fetchBookContent(bookId) {
            if (bookContentCache[bookId]) {
                return bookContentCache[bookId];
            }
            showLoader(true, `جاري تحميل بيانات الكتاب...`);
            try {
                const response = await fetch(`data/book_${bookId}.json`);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                bookContentCache[bookId] = data; // تخزين المحتوى لتجنب إعادة التحميل
                return data;
            } catch (error) {
                console.error(`Could not fetch content for book ${bookId}:`, error);
                return null;
            } finally {
                showLoader(false);
            }
        }

        // --- Rendering ---
        function renderBooksList() {
            booksListContainer.innerHTML = '';
            booksListContainer.className = currentView === 'grid' 
                ? 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6'
                : 'flex flex-col gap-4';

            if (filteredBooks.length === 0) {
                booksListContainer.innerHTML = `<p class="text-gray-400 text-center col-span-full">لم يتم العثور على كتب تطابق بحثك.</p>`;
                return;
            }

            filteredBooks.forEach(book => {
                const bookElement = document.createElement('div');
                if (currentView === 'grid') {
                    bookElement.className = 'bg-gray-800 rounded-lg overflow-hidden shadow-lg transform hover:-translate-y-1 transition-transform duration-300 cursor-pointer';
                    bookElement.innerHTML = `
                        <img src="${book.cover}" alt="${book.title}" class="w-full h-64 object-cover" onerror="this.onerror=null;this.src='https://placehold.co/300x450/111827/FFFFFF?text=Error';">
                        <div class="p-4">
                            <h3 class="font-bold text-lg text-white">${book.title}</h3>
                            <p class="text-sm text-gray-400">${book.author}</p>
                        </div>
                    `;
                } else {
                    bookElement.className = 'bg-gray-800 rounded-lg p-4 flex items-center gap-4 shadow-lg cursor-pointer hover:bg-gray-700 transition-colors';
                     bookElement.innerHTML = `
                        <img src="${book.cover}" alt="${book.title}" class="w-16 h-24 object-cover rounded-md" onerror="this.onerror=null;this.src='https://placehold.co/100x150/111827/FFFFFF?text=Error';">
                        <div class="flex-grow">
                            <h3 class="font-bold text-xl text-white">${book.title}</h3>
                            <p class="text-gray-400">${book.author}</p>
                            <p class="text-sm text-gray-500 mt-1">${(book.description || '').substring(0, 100)}...</p>
                        </div>
                    `;
                }
                bookElement.addEventListener('click', () => window.location.hash = `#/book/${book.id}`);
                booksListContainer.appendChild(bookElement);
            });
        }
        
        function sortAndRender() {
            let sorted = [...filteredBooks];
            const sortValue = sortSelect.value;
            if (sortValue === 'title_asc') {
                sorted.sort((a, b) => a.title.localeCompare(b.title, 'ar'));
            } else if (sortValue === 'title_desc') {
                sorted.sort((a, b) => b.title.localeCompare(a.title, 'ar'));
            }
            filteredBooks = sorted;
            renderBooksList();
        }
        
        function filterAndRender() {
            const query = searchInput.value.toLowerCase();
            filteredBooks = allBooks.filter(book => book.title.toLowerCase().includes(query) || book.author.toLowerCase().includes(query));
            sortAndRender();
        }
        
        async function renderBookView(bookId, activeVolumeNum, activePageNum) {
            const bookMeta = allBooks.find(b => b.id == bookId);
            if (!bookMeta) {
                bookView.innerHTML = `<p class="text-red-400 text-center">الكتاب غير موجود.</p>`;
                return;
            }
            
            const bookContentData = await fetchBookContent(bookId);
            if (!bookContentData || !bookContentData.volumes) {
                 bookView.innerHTML = `<p class="text-red-400 text-center">فشل تحميل محتوى الكتاب.</p>`;
                return;
            }

            // Render static book layout
            let volumesHTML = bookContentData.volumes.map(vol => `
                <option value="${vol.volumeNumber}" ${vol.volumeNumber == activeVolumeNum ? 'selected' : ''}>${vol.volumeTitle}</option>
            `).join('');

            bookView.innerHTML = `
                <div class="flex flex-col lg:flex-row gap-8">
                    <!-- Table of Contents & Controls -->
                    <div class="lg:w-1/4 bg-gray-800 p-4 rounded-lg self-start top-4 sticky">
                        <button id="back-to-library" class="mb-4 w-full bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-2 px-4 rounded-md transition-colors">العودة للمكتبة</button>
                        <h2 class="text-2xl font-bold text-yellow-400 mb-1">${bookMeta.title}</h2>
                        <p class="text-gray-400 mb-4">${bookMeta.author}</p>
                        <div class="mb-4">
                            <label for="volume-select" class="block mb-2 text-sm font-medium text-gray-300">اختر المجلد:</label>
                            <select id="volume-select" class="w-full bg-gray-700 text-white p-2 rounded-md border border-gray-600">${volumesHTML}</select>
                        </div>
                        <div id="toc-container" class="max-h-96 overflow-y-auto"></div>
                    </div>
                    
                    <!-- Page Content -->
                    <div class="lg:w-3/4">
                        <div id="page-content-container" class="bg-gray-800 p-6 md:p-8 rounded-lg min-h-screen">
                            <div class="flex justify-between items-center mb-4">
                                <button id="prev-page" class="bg-gray-700 hover:bg-gray-600 p-2 rounded-md">&lt; السابق</button>
                                <span id="page-indicator" class="text-lg font-semibold"></span>
                                <button id="next-page" class="bg-gray-700 hover:bg-gray-600 p-2 rounded-md">التالي &gt;</button>
                            </div>
                            <div id="page-content" class="text-xl leading-loose" style="line-height: 2.2;"></div>
                        </div>
                    </div>
                </div>`;
            
            mainContent.classList.add('hidden');
            bookView.classList.remove('hidden');

            document.getElementById('back-to-library').addEventListener('click', () => window.location.hash = '');
            document.getElementById('volume-select').addEventListener('change', (e) => {
                window.location.hash = `#/book/${bookId}/volume/${e.target.value}/page/1`;
            });

            renderPageContent(bookMeta, bookContentData, activeVolumeNum, activePageNum);
        }

        function renderPageContent(bookMeta, bookContentData, volumeNum, pageNum) {
            pageNum = parseInt(pageNum, 10);
            volumeNum = parseInt(volumeNum, 10);
            
            const volume = bookContentData.volumes.find(v => v.volumeNumber == volumeNum);
            if (!volume || !volume.content) {
                document.getElementById('page-content').innerHTML = `<p class="text-red-400">المجلد غير موجود.</p>`;
                return;
            }

            const page = volume.content.find(p => p.pageNumber == pageNum);
            document.getElementById('page-content').innerHTML = page ? page.text.replace(/\n/g, '<br>') : `<p class="text-gray-400">الصفحة غير موجودة.</p>`;
            document.getElementById('page-indicator').textContent = `صفحة ${pageNum} / ${volume.content.length}`;
            
            const tocContainer = document.getElementById('toc-container');
            tocContainer.innerHTML = volume.content.map(item => `
                <a href="#/book/${bookMeta.id}/volume/${volumeNum}/page/${item.pageNumber}" class="block p-2 rounded-md hover:bg-gray-700 ${item.pageNumber == pageNum ? 'bg-yellow-700 text-white' : ''}">
                    ${item.chapter} (ص. ${item.pageNumber})
                </a>
            `).join('');
            
            const prevBtn = document.getElementById('prev-page');
            const nextBtn = document.getElementById('next-page');
            prevBtn.disabled = pageNum <= 1;
            prevBtn.classList.toggle('disabled-btn', prevBtn.disabled);
            nextBtn.disabled = pageNum >= volume.content.length;
            nextBtn.classList.toggle('disabled-btn', nextBtn.disabled);
            
            prevBtn.onclick = () => { if(pageNum > 1) window.location.hash = `#/book/${bookMeta.id}/volume/${volumeNum}/page/${pageNum - 1}`; };
            nextBtn.onclick = () => { if(pageNum < volume.content.length) window.location.hash = `#/book/${bookMeta.id}/volume/${volumeNum}/page/${pageNum + 1}`; };
        }

        // --- URL Hash Routing ---
        async function handleUrlHash() {
            const hash = window.location.hash;
            const bookRegex = /#\/book\/(\d+)(?:\/volume\/(\d+)\/page\/(\d+))?/;
            const match = hash.match(bookRegex);

            if (match && match[1]) {
                const bookId = match[1];
                const volumeNum = match[2] || 1;
                const pageNum = match[3] || 1;
                await renderBookView(bookId, volumeNum, pageNum);
            } else {
                bookView.classList.add('hidden');
                mainContent.classList.remove('hidden');
                filterAndRender();
            }
        }

        // --- Initialization ---
        async function initializeApp() {
            showLoader(true, "جاري تحميل قائمة الكتب...");
            allBooks = await fetchMasterList();
            showLoader(false);
            if (allBooks.length > 0) {
                await handleUrlHash();
            }
        }

        searchInput.addEventListener('input', filterAndRender);
        sortSelect.addEventListener('change', sortAndRender);
        gridViewBtn.addEventListener('click', () => { currentView = 'grid'; gridViewBtn.classList.add('active'); listViewBtn.classList.remove('active'); renderBooksList(); });
        listViewBtn.addEventListener('click', () => { currentView = 'list'; listViewBtn.classList.add('active'); gridViewBtn.classList.remove('active'); renderBooksList(); });
        window.addEventListener('hashchange', handleUrlHash, false);

        initializeApp();
    });
    </script>
</body>
</html>
