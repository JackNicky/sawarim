    <script>
        const mainContent = document.getElementById('main-content');
        const resultsArea = document.getElementById('results-area');
        const searchInput = document.getElementById('search-input');
        const statsContainer = document.getElementById('stats');
        const paginationControls = document.getElementById('pagination-controls');
        const hitsList = document.getElementById('hits-list');
        const loadingSpinner = document.getElementById('loading-spinner');
        const suggestedSearchesContainer = document.getElementById('suggested-searches-container');
        const curatedResultsContainer = document.getElementById('curated-results');
        const apiResultsContainer = document.getElementById('api-results-container');

        const modalOverlay = document.getElementById('modal-overlay');
        const modalContainer = document.getElementById('modal-container');
        const modalCloseBtn = document.getElementById('modal-close-btn');
        const modalList = document.getElementById('modal-list');

        let manifest = null;
        const bucketCache = new Map();
        const bookCache = new Map();

        let allSuggestedItems = [];
        let searchTimeout = null;
        let currentMatches = [];
        let currentTerms = [];
        let currentRawQuery = '';
        let currentTotalHits = 0;
        let currentBooksCount = 0;
        let currentDurationMs = 0;
        let currentPage = 1;
        const PAGE_SIZE = 20;

        const DIACRITIC_CLASS = "[\\u064B-\\u065F\\u0670]*";

        function normalizeArabic(text) {
            if (!text) return "";
            return text
                .replace(/[\u064B-\u065F\u0670]/g, "")
                .replace(/[أإآٱ]/g, "ا")
                .replace(/ى/g, "ي")
                .replace(/ؤ/g, "و")
                .replace(/ئ/g, "ي")
                .replace(/ة/g, "ه")
                .replace(/\s+/g, " ")
                .trim();
        }

        function getBucketKey(word) {
            if (!word) return "misc";
            const ch = word[0];
            if (ch >= "\u0600" && ch <= "\u06FF") return ch;
            if (ch >= "0" && ch <= "9") return "num";
            return "misc";
        }

        async function ensureManifestLoaded() {
            if (manifest) return manifest;
            const res = await fetch("manifest_v2.json");
            if (!res.ok) throw new Error("تعذر قراءة manifest_v2.json");
            manifest = await res.json();
            return manifest;
        }

        async function loadBucket(bucketKey) {
            await ensureManifestLoaded();
            if (bucketCache.has(bucketKey)) return bucketCache.get(bucketKey);
            const relPath = manifest.buckets[bucketKey];
            if (!relPath) {
                bucketCache.set(bucketKey, {});
                return {};
            }
            const res = await fetch(relPath);
            if (!res.ok) throw new Error("فشل تحميل جزء الفهرس: " + relPath);
            const data = await res.json();
            bucketCache.set(bucketKey, data);
            return data;
        }

		async function loadBook(bookId) {
			await ensureManifestLoaded();
			const key = String(bookId);
			if (bookCache.has(key)) return bookCache.get(key);

			if (key === "36") {
				const partPaths = [
					"books/book_36_part1.json",
					"books/book_36_part2.json",
					"books/book_36_part3.json",
					"books/book_36_part4.json"
				];
				const partsData = await Promise.all(
					partPaths.map(async (relPath) => {
						const res = await fetch(relPath);
						if (!res.ok) throw new Error("فشل تحميل جزء الكتاب 36: " + relPath);
						return res.json();
					})
				);

				const mergedPages = [];
				let baseMeta = {};
				for (const part of partsData) {
					const { pages, ...rest } = part;
					if (!baseMeta.title) baseMeta = rest;
					if (Array.isArray(pages)) {
						mergedPages.push(...pages);
					}
				}

				const mergedBook = { ...baseMeta, pages: mergedPages };
				bookCache.set(key, mergedBook);
				return mergedBook;
			}

			const bookMeta = manifest.books.find(b => String(b.id) === key);
			if (!bookMeta) return null;
			const res = await fetch(bookMeta.file);
			if (!res.ok) throw new Error("فشل تحميل الكتاب: " + bookMeta.file);
			const data = await res.json();
			bookCache.set(key, data);
			return data;
		}

        function intersectBookMaps(mapsList) {
            if (!mapsList.length) return new Map();

            const candidateBooks = new Set(Object.keys(mapsList[0]));
            for (let i = 1; i < mapsList.length; i++) {
                const keys = new Set(Object.keys(mapsList[i]));
                for (const bId of candidateBooks) {
                    if (!keys.has(bId)) candidateBooks.delete(bId);
                }
            }

            const result = new Map();
            for (const bId of candidateBooks) {
                let commonPages = new Set(mapsList[0][bId]);
                for (let i = 1; i < mapsList.length; i++) {
                    const nextSet = new Set(mapsList[i][bId]);
                    commonPages = new Set([...commonPages].filter(p => nextSet.has(p)));
                    if (commonPages.size === 0) break;
                }
                if (commonPages.size > 0) {
                    result.set(bId, Array.from(commonPages).sort((a, b) => a - b));
                }
            }
            return result;
        }

        function escapeHtml(str) {
            return (str || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function buildFlexCharPattern(normWord) {
            const parts = [];
            for (const ch of normWord) {
                let group = ch;
                if (ch === "ا") group = "[اأإآٱ]";
                else if (ch === "ي") group = "[ييىئ]";
                else if (ch === "و") group = "[ووؤ]";
                else if (ch === "ه") group = "[ههة]";
                else group = ch.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                parts.push(`${group}${DIACRITIC_CLASS}`);
            }
            return `(^|[^\\u0600-\\u06FF0-9])(${parts.join("")})(?=[^\\u0600-\\u06FF0-9]|$)`;
        }

        function scorePageAgainstTerms(text, terms) {
            if (!text || !terms.length) return 0;
            const cleanText = text.replace(/\s+/g, " ");
            const normClean = normalizeArabic(cleanText);
            let score = 0;

            const fullPhrase = terms.join(" ");
            if (terms.length > 1 && normClean.includes(fullPhrase)) {
                score += 1000;
            }

            const positions = [];
            for (const t of terms) {
                const re = new RegExp(buildFlexCharPattern(t), "g");
                let m;
                let count = 0;
                while ((m = re.exec(cleanText)) !== null) {
                    count++;
                    const startPos = m.index + (m[1] ? m[1].length : 0);
                    positions.push({ term: t, pos: startPos });
                    if (count > 10) break;
                }
                score += Math.min(count, 5) * 10;
            }

            for (let i = 0; i < positions.length; i++) {
                for (let j = i + 1; j < positions.length; j++) {
                    if (positions[i].term !== positions[j].term) {
                        const dist = Math.abs(positions[i].pos - positions[j].pos);
                        if (dist <= 120) {
                            score += 120 - dist;
                        }
                    }
                }
            }

            return score;
        }

        function buildSnippet(text, terms) {
            if (!text) return "";
            const cleanText = text.replace(/\s+/g, " ").trim();

            let bestStart = 0;
            let bestWindowScore = -1;

            const candidatePositions = [];
            for (const t of terms) {
                if (t.length < 2) continue;
                const re = new RegExp(buildFlexCharPattern(t), "g");
                let m;
                let count = 0;
                while ((m = re.exec(cleanText)) !== null) {
                    candidatePositions.push(m.index + (m[1] ? m[1].length : 0));
                    count++;
                    if (count > 25) break;
                }
            }

            if (candidatePositions.length > 0) {
                for (const pos of candidatePositions) {
                    const start = Math.max(0, pos - 70);
                    const end = Math.min(cleanText.length, start + 270);
                    const windowSlice = cleanText.slice(start, end);
                    let winScore = 0;
                    const uniqueInWin = new Set();
                    for (const t of terms) {
                        const re = new RegExp(buildFlexCharPattern(t));
                        if (re.test(windowSlice)) {
                            uniqueInWin.add(t);
                            winScore += 50;
                        }
                    }
                    winScore += uniqueInWin.size * 100;
                    if (winScore > bestWindowScore) {
                        bestWindowScore = winScore;
                        bestStart = start;
                    }
                }
            }

            const sliceEnd = Math.min(cleanText.length, bestStart + 270);
            let snippet = cleanText.slice(bestStart, sliceEnd);
            if (bestStart > 0) snippet = "..." + snippet;
            if (sliceEnd < cleanText.length) snippet = snippet + "...";

            let highlighted = snippet;
            for (const term of terms) {
                if (term.length < 2) continue;
                const pattern = new RegExp(buildFlexCharPattern(term), "g");
                highlighted = highlighted.replace(pattern, (_, prefix, matchedWord) => {
                    return `${prefix}[[MARK_START]]${matchedWord}[[MARK_END]]`;
                });
            }

            return escapeHtml(highlighted)
                .replace(/\[\[MARK_START\]\]/g, '<span class="highlight">')
                .replace(/\[\[MARK_END\]\]/g, '</span>');
        }

        function getHighlightParam(rawQuery) {
            const words = rawQuery.trim().split(/\s+/).filter(Boolean);
            return words.length > 0 ? words[words.length - 1] : "";
        }

        function setDisplayMode(mode) {
            if (mode === 'center') {
                mainContent.classList.remove('search-mode');
                mainContent.classList.add('center-mode');
                resultsArea.style.display = 'none';
            } else {
                mainContent.classList.remove('center-mode');
                mainContent.classList.add('search-mode');
                resultsArea.style.display = 'block';
            }
        }

        function renderPagination(totalItems) {
            paginationControls.innerHTML = '';
            const totalPages = Math.ceil(totalItems / PAGE_SIZE);
            if (totalPages <= 1) return;

            const prevBtn = document.createElement('button');
            prevBtn.textContent = 'السابق';
            prevBtn.disabled = currentPage <= 1;
            prevBtn.className = 'bg-gray-800 hover:bg-gray-700 disabled:opacity-40 text-gray-200 px-3 py-1 rounded-lg border border-gray-700 text-xs font-bold';
            prevBtn.onclick = () => renderResultPage(currentPage - 1);

            const label = document.createElement('span');
            label.className = 'text-xs text-gray-400';
            label.textContent = `${currentPage} / ${totalPages}`;

            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'التالي';
            nextBtn.disabled = currentPage >= totalPages;
            nextBtn.className = 'bg-gray-800 hover:bg-gray-700 disabled:opacity-40 text-gray-200 px-3 py-1 rounded-lg border border-gray-700 text-xs font-bold';
            nextBtn.onclick = () => renderResultPage(currentPage + 1);

            paginationControls.appendChild(prevBtn);
            paginationControls.appendChild(label);
            paginationControls.appendChild(nextBtn);
        }

		async function renderResultPage(pageNum) {
			currentPage = pageNum;
			if (loadingSpinner) loadingSpinner.style.display = 'block';
			statsContainer.textContent = `جاري تحميل نتائج الصفحة ${pageNum}...`;
			await new Promise(resolve => requestAnimationFrame(resolve));

			try {
				const startIdx = (pageNum - 1) * PAGE_SIZE;
				const endIdx = startIdx + PAGE_SIZE;

				const flatRefs = [];
				for (const item of currentMatches) {
					for (const pIdx of item.pageIndices) {
						flatRefs.push({ bookId: item.bookId, pageIndex: pIdx });
					}
				}

				const uniqueBookIdsAll = Array.from(new Set(flatRefs.map(r => r.bookId)));
				for (const bId of uniqueBookIdsAll) {
					await loadBook(bId);
				}

				const rankedRefs = [];
				for (const ref of flatRefs) {
					const bookObj = bookCache.get(String(ref.bookId));
					const pageObj = bookObj?.pages?.[ref.pageIndex];
					const score = pageObj ? scorePageAgainstTerms(pageObj.t, currentTerms) : 0;
					rankedRefs.push({ ...ref, score });
				}

				rankedRefs.sort((a, b) => b.score - a.score);
				const pageSlice = rankedRefs.slice(startIdx, endIdx);

				statsContainer.textContent = `تم العثور على ${currentTotalHits} نتيجة في ${currentBooksCount} كتاب خلال ${currentDurationMs}ms`;
				hitsList.innerHTML = '';

				if (pageSlice.length === 0) {
					hitsList.innerHTML = `
                        <div class="text-center text-gray-400 text-lg p-6 bg-gray-800 rounded-lg shadow-inner">
                            <p>لم يتم العثور على نتائج للبحث عن: <strong>${escapeHtml(currentRawQuery)}</strong></p>
                        </div>
                    `;
					paginationControls.innerHTML = '';
					return;
				}

				const highlightWord = getHighlightParam(currentRawQuery);

				for (const ref of pageSlice) {
					const bookObj = bookCache.get(String(ref.bookId));
					if (!bookObj) continue;
					const pageObj = bookObj.pages[ref.pageIndex];
					if (!pageObj) continue;

					const volumeNum = pageObj.v ?? 1;
					const pageNumVal = pageObj.p ?? 1;
					const highlightPart = highlightWord ? `?highlight=${encodeURIComponent(highlightWord)}` : '';
					const url = `../index.html#/book/${encodeURIComponent(ref.bookId)}/volume/${encodeURIComponent(volumeNum)}/page/${encodeURIComponent(pageNumVal)}${highlightPart}`;

					const card = document.createElement('div');
					card.className = 'result-item';
					card.innerHTML = `
                        <a href="${url}" target="_blank" class="result-link">
                            <div class="result-title">${escapeHtml(bookObj.title)}</div>
                            <div class="result-location">الجزء ${escapeHtml(String(volumeNum))} - صفحة ${escapeHtml(String(pageNumVal))}${pageObj.c ? ` - ${escapeHtml(String(pageObj.c))}` : ''}</div>
                            <div class="result-snippet">${buildSnippet(pageObj.t, currentTerms)}</div>
                        </a>
                    `;
					hitsList.appendChild(card);
				}

				renderPagination(rankedRefs.length);
			} finally {
				if (loadingSpinner) loadingSpinner.style.display = 'none';
			}
		}

		let lastSummaryText = "";

		async function performSearch(overrideQuery = null) {
			const rawQuery = (typeof overrideQuery === 'string' ? overrideQuery : searchInput.value).trim();

			if (!rawQuery) {
				setDisplayMode('center');
				resultsArea.style.display = 'none';
				if (loadingSpinner) loadingSpinner.style.display = 'none';
				return;
			}

			setDisplayMode('search');
			curatedResultsContainer.style.display = 'none';
			apiResultsContainer.style.display = 'block';
			hitsList.innerHTML = '';
			paginationControls.innerHTML = '';
			currentPage = 1;
			currentRawQuery = rawQuery;

			const normQuery = normalizeArabic(rawQuery);
			const terms = Array.from(new Set(normQuery.split(/\s+/).filter(w => w.length >= 2)));
			currentTerms = terms;

			if (!terms.length) {
				if (loadingSpinner) loadingSpinner.style.display = 'none';
				statsContainer.textContent = 'يرجى إدخال كلمة بطول حرفين على الأقل.';
				return;
			}

			if (loadingSpinner) loadingSpinner.style.display = 'block';
			statsContainer.textContent = 'جاري البحث في الفهرس...';
			await new Promise(resolve => requestAnimationFrame(resolve));

			const startTime = performance.now();

			try {
				const wordMaps = [];
				for (const term of terms) {
					const bKey = getBucketKey(term);
					const bucketData = await loadBucket(bKey);
					wordMaps.push(bucketData[term] || {});
				}

				const matchedMap = intersectBookMaps(wordMaps);
				let totalHits = 0;
				const pairs = [];
				for (const [bId, pageIndices] of matchedMap.entries()) {
					totalHits += pageIndices.length;
					pairs.push({ bookId: bId, pageIndices });
				}

				currentMatches = pairs;
				currentTotalHits = totalHits;
				currentBooksCount = pairs.length;
				currentDurationMs = Math.max(1, Math.round(performance.now() - startTime));

				if (totalHits === 0) {
					if (loadingSpinner) loadingSpinner.style.display = 'none';
					statsContainer.textContent = `لا توجد نتائج مطابقة خلال ${currentDurationMs}ms`;
					hitsList.innerHTML = `
                        <div class="text-center text-gray-400 text-lg p-6 bg-gray-800 rounded-lg shadow-inner">
                            <p>لم يتم العثور على نتائج للبحث عن: <strong>${escapeHtml(rawQuery)}</strong></p>
                        </div>
                    `;
					return;
				}

				await renderResultPage(1);
			} catch (err) {
				console.error(err);
				statsContainer.textContent = 'حدث خطأ أثناء البحث: ' + err.message;
			} finally {
				if (loadingSpinner) loadingSpinner.style.display = 'none';
			}
		}


	
		const searchIconBtn = document.getElementById('search-icon-btn');

		function triggerManualSearch() {
			clearTimeout(searchTimeout);
			const query = searchInput.value.trim();
			if (!query) {
				setDisplayMode('center');
				resultsArea.style.display = 'none';
				return;
			}
			performSearch(query);
		}

		searchInput.addEventListener('keydown', (e) => {
			if (e.key === 'Enter') {
				e.preventDefault();
				triggerManualSearch();
			}
		});

		searchIconBtn.addEventListener('click', triggerManualSearch);

        function showCuratedResults(item) {
            setDisplayMode('search');
            apiResultsContainer.style.display = 'none';
            curatedResultsContainer.style.display = 'grid';
            curatedResultsContainer.innerHTML = '';

            const header = document.createElement('div');
            header.className = 'flex justify-between items-center mb-2 px-1';

            const title = document.createElement('h2');
            title.className = 'text-xl font-bold text-yellow-500';
            title.textContent = `نتائج مقترحة لـ: ${item.title}`;

            const backButton = document.createElement('button');
            backButton.className = 'text-gray-400 hover:text-yellow-500 transition-colors';
            backButton.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>`;

            backButton.onclick = () => {
                setDisplayMode('center');
                searchInput.value = '';
            };

            header.appendChild(title);
            header.appendChild(backButton);
            curatedResultsContainer.appendChild(header);

            item.links.forEach(link => {
                const url = `../index.html#/book/${link.bookId}/volume/${link.volumeNumber}/page/${link.pageNumber}?highlight=${encodeURIComponent(link.highlightText)}`;
                const card = document.createElement('a');
                card.href = url;
                card.target = '_blank';
                card.className = 'result-link result-item';
                card.innerHTML = `
                    <div class="result-title">${escapeHtml(item.title)}</div>
                    <div class="result-location">${escapeHtml(link.subtitle)}</div>
                    <div class="result-snippet">...${escapeHtml(link.highlightText.substring(0, 100))}...</div>
                `;
                curatedResultsContainer.appendChild(card);
            });
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        async function loadSuggestedSearches() {
            suggestedSearchesContainer.innerHTML = `<p class="text-gray-500 text-sm animate-pulse">جاري تحميل الاقتراحات...</p>`;
            try {
                const response = await fetch('../data/search.json');
                allSuggestedItems = await response.json();
                suggestedSearchesContainer.innerHTML = '';

                if (allSuggestedItems && allSuggestedItems.length > 0) {
                    const randomItems = shuffleArray([...allSuggestedItems]).slice(0, 4);

                    randomItems.forEach((item, index) => {
                        const button = document.createElement('button');
                        button.className = 'suggested-item bg-gray-700 text-gray-200 px-4 py-2 rounded-full text-sm font-medium hover:bg-yellow-600 hover:text-gray-900 transition-colors shadow-md';
                        button.textContent = item.title;
                        button.style.animationDelay = `${index * 100}ms`;
                        button.onclick = () => showCuratedResults(item);
                        suggestedSearchesContainer.appendChild(button);
                    });

                    const moreButton = document.createElement('button');
                    moreButton.className = 'suggested-item bg-gray-800 text-yellow-500 border border-yellow-500 px-4 py-2 rounded-full text-sm font-medium hover:bg-yellow-500 hover:text-gray-900 transition-colors shadow-md';
                    moreButton.textContent = 'أخرى...';
                    moreButton.style.animationDelay = `${randomItems.length * 100}ms`;
                    moreButton.onclick = openModal;
                    suggestedSearchesContainer.appendChild(moreButton);
                }
            } catch (e) {
                console.error("Failed to load suggested searches:", e);
                suggestedSearchesContainer.innerHTML = '';
            }
        }

        function setStatus(message, isSearching = false) {
            statusText.textContent = message;
            statusText.classList.toggle("searching", isSearching);
        }

        function openModal() {
            modalList.innerHTML = '';
            allSuggestedItems.forEach(item => {
                const button = document.createElement('button');
                button.className = 'modal-list-item';
                button.textContent = item.title;
                button.onclick = () => {
                    closeModal();
                    showCuratedResults(item);
                };
                modalList.appendChild(button);
            });
            modalOverlay.classList.add('visible');
            modalContainer.classList.add('visible');
        }

        function closeModal() {
            modalOverlay.classList.remove('visible');
            modalContainer.classList.remove('visible');
        }

        modalCloseBtn.onclick = closeModal;
        modalOverlay.onclick = closeModal;

		document.addEventListener('DOMContentLoaded', () => {
			if (loadingSpinner) loadingSpinner.style.display = 'none';
			ensureManifestLoaded()
				.then(() => {
					if (statsContainer && !searchInput.value.trim()) {
						statsContainer.textContent = 'جاهز للبحث الفوري.';
					}
				})
				.catch(() => { });
			loadSuggestedSearches();
			setDisplayMode('center');

			const urlParams = new URLSearchParams(window.location.search);
			const queryFromUrl = urlParams.get('q') || urlParams.get('query');
			if (queryFromUrl) {
				searchInput.value = queryFromUrl;
				performSearch(queryFromUrl);
			}
		});

		const aiPreviewBtn = document.getElementById('ai-preview-btn');
		const aiModalOverlay = document.getElementById('ai-modal-overlay');
		const aiModalContainer = document.getElementById('ai-modal-container');
		const aiModalCloseBtn = document.getElementById('ai-modal-close-btn');

		function openAiModal() {
			aiModalOverlay.classList.add('visible');
			aiModalContainer.classList.add('visible');
		}

		function closeAiModal() {
			aiModalOverlay.classList.remove('visible');
			aiModalContainer.classList.remove('visible');
		}

		aiPreviewBtn.onclick = openAiModal;
		aiModalCloseBtn.onclick = closeAiModal;
		aiModalOverlay.onclick = closeAiModal;
    </script>
</body>
