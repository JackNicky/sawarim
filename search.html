<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بحث متقدم - مكتبة صوارم حيدرية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
        .search-results-view mark {
            background-color: #facc15;
            color: #1f2937;
            padding: 2px 1px;
            border-radius: 3px;
        }
        .progress-bar {
            transition: width 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200">
    
    <div class="container mx-auto p-4 md:p-8">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-yellow-400">بحث متقدم في المكتبة</h1>
            <p class="text-gray-400 mt-2">ابحث في محتوى جميع الكتب مباشرة من متصفحك</p>
        </header>
        
        <main>
            <div class="bg-gray-800 p-4 rounded-lg mb-8 flex flex-col md:flex-row gap-4">
                <input id="search-input" type="text" placeholder="أدخل كلمة أو جملة للبحث..." class="flex-grow bg-gray-700 text-white p-3 rounded-md border border-gray-600 focus:outline-none focus:ring-2 focus:ring-yellow-500 w-full text-lg" disabled>
                <button id="search-btn" class="bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-3 px-6 rounded-md transition-colors text-lg disabled:opacity-50 disabled:cursor-not-allowed" disabled>ابحث</button>
                <a href="index.html" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-6 rounded-md transition-colors text-lg text-center">العودة</a>
            </div>
            
            <!-- Indexing Status -->
            <div id="indexing-status" class="text-center my-6 bg-gray-800 p-4 rounded-lg">
                <p id="status-text" class="text-lg text-yellow-400 mb-2">الرجاء الانتظار، يتم تجهيز فهرس البحث...</p>
                <div class="w-full bg-gray-700 rounded-full h-2.5">
                    <div id="progress-bar" class="bg-yellow-500 h-2.5 rounded-full progress-bar" style="width: 0%"></div>
                </div>
            </div>

            <div id="search-results-view" class="search-results-view space-y-6">
                <!-- Search results will be injected here -->
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            const searchResultsView = document.getElementById('search-results-view');
            const indexingStatus = document.getElementById('indexing-status');
            const statusText = document.getElementById('status-text');
            const progressBar = document.getElementById('progress-bar');
            
            let searchIndex = []; // سيحتوي على بيانات كل الصفحات للبحث
            let indexBuilt = false;

            // هذه الدالة تبني الفهرس في المتصفح عند تحميل الصفحة
            async function buildSearchIndex() {
                try {
                    const booksResponse = await fetch('data/books.json');
                    const books = await booksResponse.json();
                    const totalBooks = books.length;

                    for (let i = 0; i < totalBooks; i++) {
                        const bookMeta = books[i];
                        statusText.textContent = `جاري فهرسة الكتب... (${i + 1} / ${totalBooks}) - ${bookMeta.title}`;
                        const progress = ((i + 1) / totalBooks) * 100;
                        progressBar.style.width = `${progress}%`;

                        try {
                            const contentResponse = await fetch(`data/book_${bookMeta.id}.json`);
                            if(contentResponse.ok) {
                                const bookContent = await contentResponse.json();
                                if (bookContent.volumes) {
                                    bookContent.volumes.forEach(volume => {
                                        if (volume.content) {
                                            volume.content.forEach(page => {
                                                searchIndex.push({
                                                    b: bookMeta.id,
                                                    t: bookMeta.title,
                                                    v: volume.volumeNumber,
                                                    vt: volume.volumeTitle,
                                                    p: page.pageNumber,
                                                    txt: page.text
                                                });
                                            });
                                        }
                                    });
                                }
                            }
                        } catch (bookError) {
                            console.warn(`Could not load or process book ${bookMeta.id}:`, bookError);
                        }
                    }

                    indexBuilt = true;
                    indexingStatus.classList.add('hidden');
                    searchInput.disabled = false;
                    searchBtn.disabled = false;
                    searchInput.placeholder = "فهرس البحث جاهز، يمكنك البدء الآن!";

                } catch (error) {
                    console.error("Fatal error building search index:", error);
                    statusText.innerHTML = `<p class="text-red-400">فشل بناء فهرس البحث. لا يمكن إكمال العملية.</p>`;
                    progressBar.style.backgroundColor = 'red';
                }
            }

            function performSearch() {
                if (!indexBuilt) return;
                const query = searchInput.value.trim().toLowerCase();
                searchResultsView.innerHTML = '';
                
                if (query.length < 3) {
                     searchResultsView.innerHTML = `<p class="text-center text-gray-400">الرجاء إدخال 3 أحرف على الأقل للبحث.</p>`;
                    return;
                }

                const startTime = performance.now();
                const results = searchIndex.filter(item => item.txt.toLowerCase().includes(query));
                const endTime = performance.now();
                const searchTime = ((endTime - startTime) / 1000).toFixed(2);

                if(results.length === 0) {
                     searchResultsView.innerHTML = `<p class="text-center text-gray-400">لم يتم العثور على نتائج لكلمة "${query}".</p>`;
                } else {
                    const status = document.createElement('p');
                    status.className = 'text-center text-gray-400 mb-4';
                    status.textContent = `تم العثور على ${results.length} نتيجة في ${searchTime} ثانية.`;
                    searchResultsView.appendChild(status);
                    renderResults(results, query);
                }
            }

            function renderResults(results, query) {
                const regex = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
                results.forEach(res => {
                    const text = res.txt;
                    const index = text.toLowerCase().indexOf(query);
                    const start = Math.max(0, index - 70);
                    const end = Math.min(text.length, index + query.length + 70);
                    let snippet = text.substring(start, end);

                    if (start > 0) snippet = "..." + snippet;
                    if (end < text.length) snippet = snippet + "...";

                    snippet = snippet.replace(regex, match => `<mark>${match}</mark>`);

                    const resultEl = document.createElement('a');
                    resultEl.href = `index.html#/book/${res.b}/volume/${res.v}/page/${res.p}`;
                    resultEl.target = "_blank";
                    resultEl.className = 'block bg-gray-800 p-4 rounded-lg hover:bg-gray-700 transition-colors';
                    resultEl.innerHTML = `
                        <h3 class="font-bold text-lg text-white">${res.t}</h3>
                        <p class="text-sm text-gray-400 mb-2">${res.vt} - صفحة ${res.p}</p>
                        <p class="text-gray-300 leading-relaxed">${snippet}</p>
                    `;
                    searchResultsView.appendChild(resultEl);
                });
            }

            searchBtn.addEventListener('click', performSearch);
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    performSearch();
                }
            });

            // بدء عملية الفهرسة عند تحميل الصفحة
            buildSearchIndex();
        });
    </script>
</body>
</html>
