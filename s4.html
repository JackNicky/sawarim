<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة الذكية - فوري</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- نسخة FlexSearch الكاملة لدعم البحث المتقدم -->
    <script src="https://cdn.jsdelivr.net/gh/nextapps-de/flexsearch@0.7.31/dist/flexsearch.bundle.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #0f172a; color: #e2e8f0; overflow-x: hidden; }
        #main-content { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .center-mode { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; max-width: 42rem; margin: 0 auto; }
        .search-mode { padding-top: 1.5rem; max-width: 64rem; margin: 0 auto; }
        
        .search-input {
            width: 100%; background-color: #1e293b; color: #f8fafc; border: 1px solid #334155;
            border-radius: 1rem; padding: 1rem 1.5rem; font-size: 1.25rem; transition: all 0.2s;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .search-input:focus { border-color: #f59e0b; outline: none; box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.2); }
        
        .result-card { 
            background: #1e293b; border: 1px solid #334151; border-radius: 1rem; 
            padding: 1.5rem; margin-bottom: 1rem; display: block; transition: all 0.2s;
            animation: fadeIn 0.3s ease-out forwards;
        }
        .result-card:hover { background: #2d3748; transform: scale(1.01); border-color: #475569; }
        .highlight { color: #fbbf24; font-weight: bold; background: rgba(251, 191, 36, 0.1); padding: 0 2px; border-radius: 2px; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* منع تذبذب الواجهة */
        #results-list { min-height: 200px; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>

    <main id="main-content" class="container mx-auto p-4 center-mode">
        <div id="search-block" class="w-full flex flex-col items-center">
            <img id="logo-img" src="logo.png" class="transition-all duration-500 w-48 h-auto mb-8" 
                 onerror="this.src='https://placehold.co/400x120/0f172a/F59E0B?text=المكتبة+الذكية&font=tajawal'">
            
            <div class="relative w-full group">
                <input type="text" id="search-input" class="search-input" placeholder="ابحث عن أي شيء..." autocomplete="off">
                <div id="loading-dot" class="absolute left-5 top-5 hidden">
                    <span class="relative flex h-3 w-3">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-3 w-3 bg-amber-500"></span>
                    </span>
                </div>
            </div>
        </div>

        <div id="suggestions-box" class="flex flex-wrap justify-center gap-3 mt-8"></div>

        <div id="results-area" class="w-full mt-8 hidden">
            <div id="results-list" class="space-y-4 pb-20"></div>
        </div>
    </main>

    <script>
        // --- 1. إعداد الـ Web Worker داخلياً لضمان السرعة والعمل على GitHub ---
        const workerBlob = new Blob([`
            importScripts('https://cdn.jsdelivr.net/gh/nextapps-de/flexsearch@0.7.31/dist/flexsearch.bundle.js');

            const index = new FlexSearch.Document({
                document: { id: "id", index: ["text", "bookTitle"], store: ["bookTitle", "volumeNumber", "pageNumber", "text", "bookId"] },
                tokenize: "full", // يسمح بالبحث عن أجزاء الكلمات (مثل Algolia)
                context: true,
                language: "ar",
                optimize: true,
                resolution: 9
            });

            onmessage = async function(e) {
                const { type, payload } = e.data;
                if (type === 'LOAD_PART') {
                    try {
                        const res = await fetch(payload.url);
                        const data = await res.json();
                        const records = Array.isArray(data) ? data : (data.records || []);
                        records.forEach(doc => index.add(doc));
                        postMessage({ type: 'PART_READY', part: payload.part });
                    } catch(err) {}
                }
                if (type === 'SEARCH') {
                    const results = index.search(payload.query, { limit: 30, enrich: true, suggest: true });
                    postMessage({ type: 'RESULTS', results, query: payload.query });
                }
            };
        `], { type: 'application/javascript' });

        const worker = new Worker(URL.createObjectURL(workerBlob));
        const input = document.getElementById('search-input');
        const resultsArea = document.getElementById('results-area');
        const resultsList = document.getElementById('results-list');
        const mainContent = document.getElementById('main-content');
        const dot = document.getElementById('loading-dot');

        let curatedData = [];
        let isSearching = false;

        // --- 2. التحميل الصامت والذكي ---
        async function init() {
            // تحميل الاقتراحات فوراً (الطبقة السريعة)
            try {
                const res = await fetch('data/search.json');
                curatedData = await res.json();
                renderSuggestions(curatedData);
            } catch(e) {}

            // تحميل الأجزاء الـ 11 عبر الـ Worker
            for (let i = 1; i <= 11; i++) {
                worker.postMessage({ 
                    type: 'LOAD_PART', 
                    payload: { url: `./data/index_parts/docs_part_${i}.json`, part: i } 
                });
            }
        }

        // --- 3. محرك البحث التفاعلي ---
        input.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            
            if (query.length > 1) {
                if (!isSearching) {
                    toggleMode(true);
                    isSearching = true;
                }
                
                dot.classList.remove('hidden');

                // البحث الفوري في الاقتراحات (بينما يعمل الـ Worker)
                const curatedResults = curatedData.filter(item => 
                    item.title.includes(query) || (item.links && item.links.some(l => l.subtitle.includes(query)))
                );

                // إرسال طلب البحث العميق للـ Worker
                worker.postMessage({ type: 'SEARCH', payload: { query } });

                // عرض النتائج المنسقة (سيتم تحديثها فور رد الـ Worker)
                updateUI(curatedResults, [], query);
            } else {
                isSearching = false;
                toggleMode(false);
            }
        });

        worker.onmessage = function(e) {
            const { type, results, query } = e.data;
            if (type === 'RESULTS' && query === input.value.trim()) {
                dot.classList.add('hidden');
                const deepData = results.length > 0 ? results[0].result.map(r => r.doc) : [];
                const curatedResults = curatedData.filter(item => item.title.includes(query));
                updateUI(curatedResults, deepData, query);
            }
        };

        function updateUI(curated, deep, query) {
            resultsList.innerHTML = '';
            
            // ترتيب: المنسقة أولاً ثم العميقة
            const combined = [...curated.map(c => ({...c, _isCurated: true})), ...deep];
            
            if (combined.length === 0) {
                resultsList.innerHTML = `<div class="text-center py-20 text-gray-500 text-lg">لا توجد نتائج مطابقة لـ "${query}"</div>`;
                return;
            }

            const fragment = document.createDocumentFragment();
            combined.forEach((item, index) => {
                if (index > 40) return; // الحد الأقصى للعرض لضمان السلاسة

                const url = item._isCurated ? '#' : `index.html#/book/${item.bookId}/volume/${item.volumeNumber}/page/${item.pageNumber}?highlight=${encodeURIComponent(query)}`;
                const title = item._isCurated ? item.title : item.bookTitle;
                const body = item._isCurated ? (item.links?.[0]?.subtitle || 'موضوع مقترح') : (item.text.substring(0, 200) + '...');
                
                const card = document.createElement('a');
                card.href = url;
                card.target = "_blank";
                card.className = "result-card";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div class="text-amber-400 font-bold text-xl">${title}</div>
                        ${item._isCurated ? '<span class="text-[10px] bg-amber-500/20 text-amber-500 px-2 py-1 rounded">مقترح</span>' : `<span class="text-xs text-slate-500 font-mono">ج ${item.volumeNumber} / ص ${item.pageNumber}</span>`}
                    </div>
                    <div class="text-slate-300 leading-relaxed text-sm md:text-base">
                        ${body.replace(new RegExp(query, 'gi'), m => `<span class="highlight">${m}</span>`)}
                    </div>
                `;
                fragment.appendChild(card);
            });
            resultsList.appendChild(fragment);
        }

        function toggleMode(isSearch) {
            if (isSearch) {
                mainContent.classList.replace('center-mode', 'search-mode');
                document.getElementById('logo-img').className = "w-12 h-auto mb-0 absolute -top-1 right-4 opacity-50 md:opacity-100";
                document.getElementById('search-block').className = "w-full sticky top-0 z-50 bg-[#0f172a] pb-4";
                document.getElementById('suggestions-box').classList.add('hidden');
                resultsArea.classList.remove('hidden');
            } else {
                mainContent.classList.replace('search-mode', 'center-mode');
                document.getElementById('logo-img').className = "w-48 h-auto mb-8";
                document.getElementById('search-block').className = "w-full flex flex-col items-center";
                document.getElementById('suggestions-box').classList.remove('hidden');
                resultsArea.classList.add('hidden');
                input.value = '';
            }
        }

        function renderSuggestions(data) {
            const box = document.getElementById('suggestions-box');
            data.slice(0, 6).forEach(item => {
                const btn = document.createElement('button');
                btn.className = "bg-slate-800 hover:bg-amber-600 hover:text-black text-slate-400 px-4 py-2 rounded-full text-sm transition-all shadow-lg border border-slate-700";
                btn.textContent = item.title;
                btn.onclick = () => { input.value = item.title; input.dispatchEvent(new Event('input')); };
                box.appendChild(btn);
            });
        }

        // بدء التشغيل
        init();
    </script>
</body>
</html>
