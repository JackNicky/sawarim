<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البحث الذكي - النسخة المستقرة</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/gh/nextapps-de/flexsearch@0.7.31/dist/flexsearch.bundle.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #111827; color: #d1d5db; }
        .center-mode { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .search-mode { padding-top: 2rem; }
        .highlight { color: #facc15; font-weight: bold; background: rgba(245, 158, 11, 0.2); }
        .result-card { background: #1f2937; border: 1px solid #374151; border-radius: 0.75rem; padding: 1rem; margin-bottom: 1rem; display: block; }
        #debug-console { position: fixed; bottom: 0; right: 0; background: rgba(0,0,0,0.8); color: #0f0; font-family: monospace; font-size: 10px; max-height: 100px; overflow: auto; width: 100%; z-index: 9999; padding: 5px; }
    </style>
</head>
<body>

    <div id="debug-console">جاري بدء النظام...</div>

    <main id="main-content" class="container mx-auto p-4 center-mode">
        <div id="search-block" class="w-full max-w-2xl text-center">
            <h1 id="logo-text" class="text-3xl font-bold text-yellow-500 mb-6 transition-all">مكتبة صوارم حيدرية</h1>
            
            <div class="relative w-full">
                <input type="text" id="search-input" 
                       class="w-full bg-gray-800 text-white border border-gray-700 rounded-xl p-4 text-lg focus:outline-none focus:border-yellow-500 transition-all" 
                       placeholder="جاري تحميل قاعدة البيانات... انتظر قليلاً" disabled>
                <div id="loader-icon" class="absolute left-4 top-4">
                    <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-yellow-500"></div>
                </div>
            </div>
            
            <div id="status-msg" class="text-xs text-gray-500 mt-2">جاري فحص الملفات...</div>
        </div>

        <div id="results-area" class="w-full max-w-4xl mt-10 hidden">
            <div id="meta-info" class="text-sm text-gray-400 mb-4"></div>
            <div id="results-list"></div>
        </div>
    </main>

    <script>
        // --- إعدادات النظام ---
        const log = (msg) => {
            const consoleDiv = document.getElementById('debug-console');
            consoleDiv.innerHTML += `> ${msg}<br>`;
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        };

        const flexIndex = new FlexSearch.Document({
            document: {
                id: "id",
                index: ["text", "bookTitle"],
                store: ["bookTitle", "volumeNumber", "pageNumber", "text", "bookId"]
            },
            tokenize: "full",
            language: "ar"
        });

        const input = document.getElementById('search-input');
        const statusMsg = document.getElementById('status-msg');
        const resultsArea = document.getElementById('results-area');
        const resultsList = document.getElementById('results-list');
        const mainContent = document.getElementById('main-content');

        // --- وظيفة التحميل الذكي ---
        async function init() {
            try {
                log("بدء تحميل ملفات JSON...");
                let loadedCount = 0;
                const totalParts = 11;

                // تحميل الأجزاء بشكل متوازي
                const loadPromises = Array.from({ length: totalParts }, async (_, i) => {
                    const partNum = i + 1;
                    const path = `./data/index_parts/docs_part_${partNum}.json`;
                    
                    try {
                        const response = await fetch(path);
                        if (!response.ok) throw new Error(`Status ${response.status}`);
                        const data = await response.json();
                        
                        // معالجة البيانات وإضافتها للفهرس
                        const records = Array.isArray(data) ? data : (data.records || []);
                        records.forEach(doc => flexIndex.add(doc));
                        
                        loadedCount++;
                        statusMsg.innerText = `تم تحميل ${loadedCount} من ${totalParts} جزء...`;
                        log(`تم تحميل الجزء ${partNum} بنجاح`);

                        // تفعيل البحث بمجرد تحميل أول جزء لضمان "السرعة الفائقة"
                        if (loadedCount === 1) {
                            input.disabled = false;
                            input.placeholder = "ابدأ البحث الآن...";
                            document.getElementById('loader-icon').classList.add('hidden');
                        }
                    } catch (err) {
                        log(`خطأ في تحميل الجزء ${partNum}: ${err.message}`);
                    }
                });

                await Promise.all(loadPromises);
                statusMsg.innerText = "المكتبة جاهزة تماماً للبحث الفوري";
                log("اكتمل تحميل جميع الأجزاء.");

            } catch (err) {
                log(`فشل ذريع في النظام: ${err.message}`);
            }
        }

        // --- معالج البحث ---
        input.addEventListener('input', async (e) => {
            const query = e.target.value.trim();
            
            if (query.length > 1) {
                // الانتقال لوضع البحث
                mainContent.classList.remove('center-mode');
                mainContent.classList.add('search-mode');
                resultsArea.classList.remove('hidden');
                document.getElementById('logo-text').classList.add('text-xl', 'mb-2');

                const start = performance.now();
                const results = await flexIndex.search(query, { limit: 30, enrich: true });
                const end = performance.now();

                displayResults(results, query, (end - start).toFixed(2));
            } else {
                mainContent.classList.add('center-mode');
                mainContent.classList.remove('search-mode');
                resultsArea.classList.add('hidden');
            }
        });

        function displayResults(results, query, time) {
            resultsList.innerHTML = '';
            // تجميع النتائج من جميع الحقول
            let rawData = [];
            if (results && results.length > 0) {
                const combined = new Set();
                results.forEach(r => r.result.forEach(item => combined.add(JSON.stringify(item.doc))));
                rawData = Array.from(combined).map(s => JSON.parse(s));
            }

            document.getElementById('meta-info').innerText = `تم العثور على ${rawData.length} نتيجة في ${time}ms`;

            if (rawData.length === 0) {
                resultsList.innerHTML = '<div class="text-center p-10">لا توجد نتائج تطابق بحثك</div>';
                return;
            }

            rawData.forEach(doc => {
                const url = `index.html#/book/${doc.bookId}/volume/${doc.volumeNumber}/page/${doc.pageNumber}?highlight=${encodeURIComponent(query)}`;
                const snippet = doc.text.substring(0, 200).replace(new RegExp(query, 'gi'), m => `<span class="highlight">${m}</span>`);
                
                const card = `
                    <a href="${url}" target="_blank" class="result-card">
                        <div class="text-yellow-500 font-bold text-lg">${doc.bookTitle}</div>
                        <div class="text-xs text-gray-500 mb-2">ج ${doc.volumeNumber} - ص ${doc.pageNumber}</div>
                        <div class="text-sm leading-relaxed">${snippet}...</div>
                    </a>
                `;
                resultsList.insertAdjacentHTML('beforeend', card);
            });
        }

        // بدء التشغيل
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
